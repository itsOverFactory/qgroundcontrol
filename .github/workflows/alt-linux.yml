name: Alt Linux

# Build for the itsOverFactory fork: Linux x86_64 AppImage (Release or Debug).
# Runs on standard GitHub-hosted runners (free for public repositories).

on:
  # Manual builds only for now (Actions -> Alt Linux -> Run workflow, pick the branch).
  # push:
  #   branches:
  #     - alt/Stable_V5.1
  #     - alt/staging
  #   paths-ignore:
  #     - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}

      # linuxdeploy strips binaries on Ubuntu (cmake/install/CreateAppImage.cmake); keep Debug symbols.
      - name: Keep debug symbols in AppImage
        if: env.BUILD_TYPE == 'Debug'
        run: echo "NO_STRIP=1" >> "$GITHUB_ENV"

      - name: Create AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}

      - name: Verify AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/QGroundControl-x86_64.AppImage
          type: appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-x86_64-${{ env.BUILD_TYPE }}.AppImage
          path: ${{ runner.temp }}/build/QGroundControl-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
